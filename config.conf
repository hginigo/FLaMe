# Size for all blocks in Bytes
block_size=10240
# Policy for caching the blocks
policy=2
topology_directed=off
#output=out.out
#debug=debug.dbg
#UNIMPLEMENTED: topology_file=
#UNIMPLEMENTED: rounds_file=
barriers=off
#UNIMPLEMENTED: seed=0
#UNIMPLEMENTED: blocks_per_node=1
backend_cmd=python3 "backend_stub.py"
model_name=stub
epochs=1
ms_per_epoch=500
# Default per-link propagation delay in ms; .tpl lines may override per-link
latency_ms=5
