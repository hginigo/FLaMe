# Size for all blocks in Bytes
block_size=10240
# Policy for caching the blocks
policy=2
topology_directed=off
#output=out.out
#debug=debug.dbg
#UNIMPLEMENTED: topology_file=
#UNIMPLEMENTED: rounds_file=
barriers=off
#UNIMPLEMENTED: seed=0
#UNIMPLEMENTED: blocks_per_node=1
backend_cmd=python3 "backend_stub.py"
model_name=stub
epochs=1
ms_per_epoch=500
# Default per-link propagation delay in ms; .tpl lines may override per-link
latency_ms=5
# Size (in bytes) of request/ack control flows, as opposed to actual block/model transfers
control_bytes=40
# static (default): hop-count path precomputed once at startup.
# dynamic: each flow resolves its path ad-hoc from current link contention,
#          minimizing the sum of 1/bw over hops.
# widest: each flow resolves its path ad-hoc, maximizing the path's
#         bottleneck bandwidth (the min corresp_bw across hops).
# hybrid: like dynamic, but each hop also costs a fixed hop_penalty, so a
#         detour is taken only when its bandwidth gain beats the extra hop.
# widest_hybrid: like widest, but hop_penalty B/ms is subtracted from the
#         path bottleneck per hop, discounting longer paths.
routing=static
# hybrid only: fixed per-hop cost added to each link's 1/bw cost (same fixed-point
# units as the internal route cost; an uncontended mid-weight link is ~100-300).
# 0 makes hybrid == dynamic; large values make it approach static. Tune per topology.
hop_penalty=1600
