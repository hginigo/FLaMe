# Backend/execution mode:
#   synthetic (default): in-process, no external process. Model transfers are
#     sized by model_size and every node's TRAIN takes train_time sim-ms.
#   python: spawn backend_cmd and talk protocol.txt over a pipe (real training).
#   trace: replay a real DFL run. Same zero-copy model handling as synthetic
#     (so model_size still sizes transfers), but each TRAIN and aggregation
#     costs what rounds_file recorded for that (node, round). Times the trace
#     omits fall back to train_time / aggregate_time below.
backend_mode=trace
# Model wire size in bytes (synthetic mode). Sizes every model-transfer flow.
model_size=1048576
# sim-ms each node's TRAIN takes (synthetic mode; trace-mode fallback).
train_time=400
# sim-ms each aggregation takes (synthetic mode; trace-mode fallback for traces
# that record no aggregation time). Was hardcoded to 0 before this key existed.
aggregate_time=0
# Policy for caching the blocks
policy=2
topology_directed=off
#output=out.out
#debug=debug.dbg
#UNIMPLEMENTED: topology_file=
# DFL execution trace. When set, the .tpl supplies only its first (physical)
# topology and the trace supplies the rounds: each round's `neighbours` lists
# become one virtual overlay, so the workload's READs follow what the real run
# actually did. Any virtual sections in the .tpl are then ignored. Trace times
# are wall-clock seconds and are converted to sim-ms on load.
rounds_file=traces_heads.out
barriers=off
# Disconnected agents: comma-separated node ids whose physical links are all cut.
# They still train and aggregate their own model every round, but never exchange
# models; overlay/trace READs to or from them are dropped (counted as reads_dropped).
# Nodes that no .tpl edge mentions, or that sit in another connected component,
# are disconnected the same way without being listed here.
#disconnected=3,7
#UNIMPLEMENTED: seed=0
#UNIMPLEMENTED: blocks_per_node=1
# python mode only:
#backend_cmd=python3 "backend_stub.py"
#model_name=stub
#epochs=1
#ms_per_epoch=500
# Default per-link propagation delay in ms; .tpl lines may override per-link.
# (The companion .tpl field, link weight, is in Mbit/s -> B/ms via Bpms.)
latency_ms=5
# Size (in bytes) of request/ack control flows, as opposed to actual block/model transfers
control_bytes=40
# static (default), alias bfs: cached hop-count shortest path, precomputed at startup.
# dijkstra: cached shortest path by 1/bandwidth (each link's max cap, no contention);
#           identical to static/bfs when every link has the same bandwidth cap.
# dynamic: each flow resolves its path ad-hoc from current link contention,
#          minimizing the sum of 1/bw over hops.
# widest: each flow resolves its path ad-hoc, maximizing the path's
#         bottleneck bandwidth (the min corresp_bw across hops).
# hybrid: like dynamic, but each hop also costs a fixed hop_penalty, so a
#         detour is taken only when its bandwidth gain beats the extra hop.
# widest_hybrid: like widest, but hop_penalty B/ms is subtracted from the
#         path bottleneck per hop, discounting longer paths.
routing=widest
# hybrid only: fixed per-hop cost added to each link's 1/bw cost (same fixed-point
# units as the internal route cost; an uncontended mid-weight link is ~100-300).
# 0 makes hybrid == dynamic; large values make it approach static. Tune per topology.
hop_penalty=1600
